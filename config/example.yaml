# Paths are resolved from the directory where snakemake is invoked.
runs:
  hg002_indel_sv:
    manifest: config/families/HG002.json
    minimum_variant_length: 30
    error_rate: 0.08
    parent_readability_policy: marker_assisted
    threads: 16
    mem_mb: 64000
# Add a mapped truth TSV under benchmarks only after discovery is configured.
